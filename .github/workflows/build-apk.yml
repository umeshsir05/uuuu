name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Debug APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Error: Gradle Wrapper not found."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Error: Gradle Wrapper properties not found."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: APK not found at $EXPECTED_APK"
            find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK is empty."
            exit 1
          fi

          APK_SIZE=$(wc -c < "$EXPECTED_APK")
          echo "APK verified: $EXPECTED_APK"
          echo "APK size: $APK_SIZE bytes"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_NAME=$(echo "$REPO_NAME" |
            tr '[:upper:]' '[:lower:]' |
            sed 's/[^a-z0-9._-]/-/g')

          ASSET_FILENAME="${REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          test -s "$ASSET_PATH"

          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"

          cat > "$NOTES_FILE" <<EOF
          ### Debug APK Build #${GITHUB_RUN_NUMBER}

          - Build type: Debug APK
          - Built by: GitHub Actions
          - Source commit: ${GITHUB_SHA}
          - Run number: ${GITHUB_RUN_NUMBER}
          - Run attempt: ${GITHUB_RUN_ATTEMPT}
          - Purpose: Testing and evaluation
          - Notice: This is a debug build, not a production Play Store release.

          Download: ${ASSET_NAME}
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

            {
              echo "### Debug APK Release"
              echo ""
              echo "Release published successfully."
              echo ""
              echo "- Release: [${RELEASE_TAG}](${RELEASE_URL})"
              echo "- APK asset: ${ASSET_NAME}"
              echo "- Backup artifact: app-debug-apk"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "Release URL: $RELEASE_URL"
          else
            {
              echo "### Debug APK Release"
              echo ""
              echo "Release publishing failed."
              echo ""
              echo "- The APK artifact may still be available as app-debug-apk."
              echo "- Check the preceding workflow logs for the release error."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::warning::Release publishing failed."
          fi
